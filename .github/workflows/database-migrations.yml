# Applies supabase/migrations/*.sql to the production database so a deploy never
# depends on someone remembering to paste SQL into the Supabase SQL Editor.
#
# Every migration in this repo is written to be rerun safely (create ... if not
# exists, add column if not exists, drop policy if exists before create, seed
# inserts guarded by on conflict / not exists), so replaying the full set is a
# no-op once the database is current. That is what lets this workflow stay
# stateless instead of tracking which files have already run.
name: Database migrations

on:
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/database-migrations.yml'
  workflow_dispatch: {}

# Never let two runs write to the same database at once, and never cancel a run
# midway through applying SQL.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ensure psql is available
        run: psql --version || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)

      - name: Check the connection secret is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Add it under Settings → Secrets and variables → Actions. Use the Session pooler URI from Supabase → Project Settings → Database; the direct db.<ref>.supabase.co host is IPv6-only and GitHub runners cannot reach it."
            exit 1
          fi

      - name: Apply migrations in order
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '15'
        run: |
          set -euo pipefail
          echo "### Migrations applied" >> "$GITHUB_STEP_SUMMARY"
          for file in supabase/migrations/*.sql; do
            echo "::group::$file"
            # --single-transaction rolls the whole file back if any statement fails,
            # so a bad migration can never leave the schema half-changed.
            psql "$SUPABASE_DB_URL" --single-transaction --no-psqlrc -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
            echo "- \`$file\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Confirm the schema answers
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --no-psqlrc -v ON_ERROR_STOP=1 -At -c \
            "select 'events=' || count(*) from public.events;"
